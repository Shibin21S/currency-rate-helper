name: Daily Rate Update

on:
  schedule:
    # 17:00 UTC daily = 12:00 PM EST. During EDT (roughly March-November)
    # this runs at 1:00 PM local time instead - accepted limitation, no
    # DST-aware fix needed.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch live rates and regenerate index.html
        run: python scripts/update_rates.py

      - name: Commit and push if index.html changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "No rate changes today - skipping commit."
          else
            git add index.html
            git commit -m "Daily rate update: $(date -u +%Y-%m-%d)"
            git push
          fi
